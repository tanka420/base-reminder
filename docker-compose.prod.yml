# docker-compose.prod.yml — Base Reminder Production Compose (Pull Image Mode)
#
# Usage on production server:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Operational Invariant:
#  - NEVER scale the app service (e.g. do NOT run docker compose up --scale app=2).
#    Telegram long polling requires exactly ONE poller process per bot token.

services:
  app:
    image: ghcr.io/tanka420/base-reminder:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: base_reminder
      POSTGRES_USER: base_reminder
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U base_reminder -d base_reminder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
    driver: local
